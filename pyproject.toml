[project]
name = "medscribe"
version = "0.1.0"
description = "Voice-driven medical report generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docxtpl>=0.20.2",
  "faster-whisper>=1.2.1",
  "huggingface-hub>=1.23.0",
  "numpy>=2.5.1",
  "pyside6>=6.11.2",
  "python-docx>=1.2.0",
  "rapidfuzz>=3.14.5",
  "sounddevice>=0.5.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
]
