name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build executable
        run: uv run pyinstaller --noconfirm --name MedScribe --windowed --collect-all faster_whisper gui.py

      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path dist/MedScribe -DestinationPath MedScribe-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MedScribe-windows
          path: MedScribe-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag MedScribe-windows.zip --clobber
          } else {
            gh release create $tag MedScribe-windows.zip --generate-notes
          }
